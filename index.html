<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punxsutawney Borough Council Documents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow"></div>

    <header class="top-banner">
      <div class="banner-inner">
        <a class="brand-link" href="index.html" aria-label="Punxsutawney Borough Documents Home">
          <img
            class="brand-logo"
            src="assets/images/logo.png"
            alt="Punxsutawney Borough Open Records Logo"
            width="64"
            height="64"
          />
          <span class="brand-name">Punxsutawney Borough Documents</span>
        </a>
        <a class="btn btn-small btn-admin" href="admin.html">Admin</a>
      </div>
    </header>

    <main class="page-shell">
      <!--<section class="hero" aria-labelledby="pageTitle">
        <p class="hero-kicker">Public Records Portal</p>
        <p class="hero-subtitle">Public records grouped for transparency and easy access.</p>
      </section>-->

      <section class="layout">
        <article class="panel public-panel">
          <div class="panel-header">
            <h2>Public Records Portal</h2>
          </div>
          <p class="hint">Public records grouped for transparency and easy access.</p>
          <div id="publicGroups" class="groups"></div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <p>This website is independently operated and is not an official Borough of Punxsutawney government website.</p>
    </footer>

    <template id="publicGroupTemplate">
      <article class="group-card">
        <h3 class="group-title"></h3>
        <ul class="documents"></ul>
      </article>
    </template>

    <script src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
