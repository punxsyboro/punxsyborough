<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punxsutawney Borough Council Documents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow"></div>
    <header class="site-header">
      <h1>Punxsutawney Borough Documents</h1>
      <p>Public records grouped for transparency and easy access.</p>
    </header>

    <main class="layout">
      <section class="panel public-panel">
        <div class="panel-header">
          <h2>Public Documents</h2>
        </div>
        <div id="publicGroups" class="groups"></div>
      </section>
    </main>

    <template id="publicGroupTemplate">
      <article class="group-card">
        <h3 class="group-title"></h3>
        <ul class="documents"></ul>
      </article>
    </template>

    <script src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
